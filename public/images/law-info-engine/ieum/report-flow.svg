<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="ieum-flow-title ieum-flow-desc" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <title id="ieum-flow-title">보고서 생성·검증 경로</title>
  <desc id="ieum-flow-desc">사안 입력 뒤 Google ADK Workflow가 역할별 세션에서 조사, 독립 답변, 초안 작성, 대조·수정 순서로 실행됩니다. 조사는 검색으로 후보를 찾고 열람으로 원문을 확보하며, 첫 조사 응답의 쟁점 계획을 서버가 고정합니다. 독립 답변은 열람한 원문만으로 쟁점별 질문에 답하고, 초안은 열람 원문과 독립 답변으로 작성합니다. 대조 단계는 문장을 원문과 답에 하나씩 대조하고 어긋난 문장을 고친 뒤 다시 대조합니다. 마지막 대조 결과가 현재 본문과 일치하고 고칠 문장이 없으면 검토 완료, 오류나 시간 부족으로 대조가 끊기면 검증 전으로 저장하고 근거 검토만 다시 실행할 수 있습니다. 요청 시간 예산, 모델 호출별 제한 시간, 도구 호출 상한을 두고 남은 시간이 부족한 라운드는 시작하지 않습니다. 보고서 위 후속 대화는 질문을 받아 검색·열람·판례 후보 도구를 쓰고, submit_report_response 제출 도구 호출로 턴을 끝내며, 열람하지 않은 출처나 인용 없는 법적 문장은 다시 제출하게 합니다. 답변과 수정 제안의 반영은 사용자가 선택합니다.</desc>
  <defs>
    <style>
      .title { font-size: 40px; font-weight: 700; fill: #ECECE7; letter-spacing: -0.5px; }
      .lead { font-size: 22px; fill: #ABABA5; }
      .h { font-size: 26px; font-weight: 700; fill: #ECECE7; }
      .b { font-size: 22px; fill: #ABABA5; }
      .b-ink { font-size: 22px; fill: #ECECE7; }
      .acc { font-size: 22px; font-weight: 600; fill: #F3E04A; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 22px; fill: #ECECE7; }
      .box { fill: #34353A; stroke: #5A5C62; stroke-width: 2; }
      .box-key { fill: #3E3F45; stroke: #F3E04A; stroke-width: 2.5; }
      .guard { fill: none; stroke: #5A5C62; stroke-width: 2; stroke-dasharray: 10 8; }
      .arrow { fill: none; stroke: #ABABA5; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-key { fill: none; stroke: #F3E04A; stroke-width: 2.5; marker-end: url(#arrow-key); }
      .arrow-soft { fill: none; stroke: #ABABA5; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ABABA5"/>
    </marker>
    <marker id="arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F3E04A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#2A2B2F"/>

  <text x="60" y="76" class="title">보고서 생성·검증 경로</text>
  <text x="60" y="114" class="lead">Google ADK Workflow · 각 단계는 역할별 세션에서 실행</text>

  <!-- time / call guard over the model stages -->
  <rect x="367" y="140" width="1173" height="50" rx="10" class="guard"/>
  <text x="391" y="173" class="b">요청 시간 예산 · 모델 호출별 제한 시간 · 도구 호출 상한 — 남은 시간이 부족한 라운드는 시작하지 않음</text>

  <!-- main path -->
  <rect x="60" y="214" width="250" height="220" rx="14" class="box"/>
  <text x="84" y="258" class="h">사안 입력</text>
  <text x="84" y="298" class="b">사안과 질문</text>
  <text x="84" y="332" class="b">적용 법령 기준일</text>

  <path d="M310 324 H359" class="arrow"/>

  <rect x="367" y="214" width="250" height="220" rx="14" class="box"/>
  <text x="391" y="258" class="h">조사</text>
  <text x="391" y="298" class="b">검색으로 후보 확인</text>
  <text x="391" y="332" class="b">열람으로 원문 확보</text>
  <text x="391" y="372" class="acc">쟁점 계획을</text>
  <text x="391" y="404" class="acc">서버가 고정</text>

  <path d="M617 324 H667" class="arrow"/>

  <rect x="675" y="214" width="250" height="220" rx="14" class="box"/>
  <text x="699" y="258" class="h">독립 답변</text>
  <text x="699" y="298" class="b">열람한 원문만으로</text>
  <text x="699" y="332" class="b">쟁점별 질문에 답함</text>
  <text x="699" y="366" class="b">초안과 독립</text>

  <path d="M925 324 H974" class="arrow"/>

  <rect x="982" y="214" width="250" height="220" rx="14" class="box"/>
  <text x="1006" y="258" class="h">초안 작성</text>
  <text x="1006" y="298" class="b">열람 원문과</text>
  <text x="1006" y="332" class="b">독립 답변으로</text>
  <text x="1006" y="366" class="b">본문 작성</text>

  <path d="M1232 324 H1282" class="arrow"/>

  <rect x="1290" y="214" width="250" height="220" rx="14" class="box"/>
  <text x="1314" y="258" class="h">대조·수정</text>
  <text x="1314" y="298" class="b">문장을 원문·답과</text>
  <text x="1314" y="332" class="b">하나씩 대조</text>
  <text x="1314" y="366" class="b">어긋난 문장 수정</text>
  <text x="1314" y="400" class="b">후 다시 대조</text>

  <!-- outcomes -->
  <path d="M1415 434 V482" class="arrow-key"/>
  <path d="M1330 434 V462 H830 V482" class="arrow"/>

  <rect x="1120" y="490" width="420" height="150" rx="14" class="box-key"/>
  <text x="1144" y="534" class="h">검토 완료</text>
  <text x="1144" y="574" class="b-ink">마지막 대조 결과가 현재 본문과</text>
  <text x="1144" y="608" class="b-ink">일치하고 고칠 문장이 없을 때</text>

  <rect x="600" y="490" width="460" height="150" rx="14" class="box"/>
  <text x="624" y="534" class="h">검증 전 저장</text>
  <text x="624" y="574" class="b">오류·시간 부족으로 대조가 끊김</text>
  <text x="624" y="608" class="b">본문과 열람 근거는 저장</text>

  <path d="M600 565 H548" class="arrow-soft"/>

  <rect x="60" y="490" width="480" height="150" rx="14" class="box"/>
  <text x="84" y="534" class="h">근거 검토만 다시 실행</text>
  <text x="84" y="574" class="b">저장된 본문을 그대로 대조</text>
  <text x="84" y="608" class="b">조사·작성은 반복하지 않음</text>

  <!-- follow-up conversation -->
  <text x="60" y="708" class="h">보고서 위 후속 대화</text>
  <text x="312" y="708" class="b">Google ADK Runner · 세션은 PostgreSQL</text>

  <rect x="60" y="732" width="250" height="140" rx="14" class="box"/>
  <text x="84" y="774" class="h">질문</text>
  <text x="84" y="810" class="b">보고서를 보며</text>
  <text x="84" y="844" class="b">질문·수정 요청</text>

  <path d="M310 802 H352" class="arrow"/>

  <rect x="360" y="732" width="340" height="140" rx="14" class="box"/>
  <text x="384" y="774" class="h">후속 대화 에이전트</text>
  <text x="384" y="810" class="b">검색·열람·판례 후보</text>
  <text x="384" y="844" class="b">도구 호출 수 상한</text>

  <path d="M700 802 H742" class="arrow"/>

  <rect x="750" y="732" width="360" height="140" rx="14" class="box-key"/>
  <text x="774" y="774" class="h">제출로 턴 종료</text>
  <text x="774" y="810" class="mono">submit_report_response</text>
  <text x="774" y="844" class="b">도구 호출로만 답변</text>

  <path d="M1110 802 H1152" class="arrow"/>

  <rect x="1160" y="732" width="380" height="140" rx="14" class="box"/>
  <text x="1184" y="774" class="h">제출 확인</text>
  <text x="1184" y="810" class="b">열람하지 않은 출처 → 재제출</text>
  <text x="1184" y="844" class="b">인용 없는 법적 문장 → 재요청</text>

  <path d="M1350 872 V912 H185 V880" class="arrow"/>
  <text x="768" y="952" class="b-ink" text-anchor="middle">답변 · 수정 제안 — 반영은 사용자가 선택</text>
</svg>
