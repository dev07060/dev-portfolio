<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-labelledby="title desc">
  <title id="title">mobile_rag_engine 한눈에 보기</title>
  <desc id="desc">문서 추가, 검색, 답변의 세 단계를 각각 한 줄의 API 호출로 보여 주고, 아래에 측정된 검색 품질과 지원 범위를 적었다.</desc>
  <style>
    .sans { font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .head { font-size: 40px; font-weight: 700; fill: #ecece7; letter-spacing: -1px; }
    .step { font-size: 34px; font-weight: 700; fill: #ecece7; }
    .code { font-size: 27px; fill: #ecece7; }
    .fn { fill: #f3e04a; }
    .note { font-size: 25px; fill: #ababa5; }
    .num { font-size: 30px; font-weight: 700; fill: #1e2126; }
    .stat { font-size: 46px; font-weight: 500; fill: #f3e04a; letter-spacing: -1px; }
    .label { font-size: 23px; fill: #ababa5; }
  </style>

  <rect width="1200" height="980" rx="28" fill="#1e2126"/>
  <rect x="1" y="1" width="1198" height="978" rx="27" fill="none" stroke="#4a4c52" stroke-width="2"/>

  <text x="64" y="112" class="sans head">문서에서 인용 답변까지, 전부 기기 안에서</text>

  <!-- 단계를 잇는 세로선 -->
  <path d="M94 226 V642" stroke="#4a4c52" stroke-width="3"/>

  <!-- 1 -->
  <g>
    <circle cx="94" cy="226" r="30" fill="#f3e04a"/>
    <text x="94" y="237" text-anchor="middle" class="mono num">1</text>
    <text x="156" y="238" class="sans step">문서 추가</text>
    <rect x="156" y="262" width="980" height="62" rx="12" fill="#2a2d33" stroke="#4a4c52" stroke-width="1.5"/>
    <text x="180" y="302" class="mono code">rag.<tspan class="fn">addDocumentFromFile</tspan>('manual.pdf')</text>
    <text x="156" y="366" class="sans note">PDF · DOCX · Markdown → 분할 → 임베딩 → SQLite 저장</text>
  </g>

  <!-- 2 -->
  <g>
    <circle cx="94" cy="434" r="30" fill="#f3e04a"/>
    <text x="94" y="445" text-anchor="middle" class="mono num">2</text>
    <text x="156" y="446" class="sans step">검색</text>
    <rect x="156" y="470" width="980" height="62" rx="12" fill="#2a2d33" stroke="#4a4c52" stroke-width="1.5"/>
    <text x="180" y="510" class="mono code">rag.<tspan class="fn">searchHybridWithContext</tspan>(question)</text>
    <text x="156" y="574" class="sans note">HNSW 벡터 + BM25 키워드 → RRF 결합 → 토큰 예산에 맞춘 context</text>
  </g>

  <!-- 3 -->
  <g>
    <circle cx="94" cy="642" r="30" fill="#f3e04a"/>
    <text x="94" y="653" text-anchor="middle" class="mono num">3</text>
    <text x="156" y="654" class="sans step">답변</text>
    <rect x="156" y="678" width="980" height="62" rx="12" fill="#2a2d33" stroke="#4a4c52" stroke-width="1.5"/>
    <text x="180" y="718" class="mono code">rag.<tspan class="fn">ask</tspan>(question, generate: myLlm)</text>
    <text x="156" y="782" class="sans note">앱이 고른 LLM이 답하고, 근거 구절 [1]을 함께 돌려준다</text>
  </g>

  <!-- 근거 -->
  <path d="M64 824 H1136" stroke="#4a4c52" stroke-width="2"/>
  <g>
    <text x="64" y="888" class="mono stat">92.5–96.25%</text>
    <text x="64" y="930" class="sans label">정답 구절이 상위 10개 안 · 80문항</text>
  </g>
  <g>
    <text x="560" y="888" class="mono stat">0</text>
    <text x="560" y="930" class="sans label">검색에 필요한 서버</text>
  </g>
  <g>
    <text x="800" y="888" class="mono stat">4</text>
    <text x="800" y="930" class="sans label">iOS · Android · macOS · Windows</text>
  </g>
</svg>
